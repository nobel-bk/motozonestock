<!DOCTYPE html>
<html lang="bn" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MS Moto Zone - Manager Login | Hero Store & Service Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs (Compat v10) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --primary: #e11d48;
      --primary-hover: #be123c;
      --primary-glow: rgba(225,29,72,0.25);
      --text: #0f172a;
      --sub: #475569;
      --input-bg: #ffffff;
      --emerald: #10b981;
      --rose: #f43f5e;
    }
    
    html.dark {
      --bg: #0b0f19;
      --card: #1f293d;
      --border: rgba(255,255,255,0.08);
      --text: #f3f4f6;
      --sub: #9ca3af;
      --input-bg: #0f172a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 20px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 440px;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-brand-icon {
      width: 68px; height: 68px;
      background: linear-gradient(135deg, var(--primary), #be123c);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; color: #fff;
      margin: 0 auto 16px;
      box-shadow: 0 8px 25px var(--primary-glow);
    }

    .login-brand h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text);
    }

    .login-brand p {
      font-size: 0.9rem;
      color: var(--sub);
      margin-top: 4px;
    }

    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--sub);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(225,29,72,0.15);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), #be123c);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px var(--primary-glow);
      transition: all 0.2s ease;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(225,29,72,0.4);
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--sub);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      margin-top: 20px;
      transition: color 0.2s;
    }

    .back-home:hover {
      color: var(--primary);
    }

    .error-msg {
      display: none;
      background: rgba(244,63,94,0.12);
      border: 1px solid rgba(244,63,94,0.3);
      color: #f43f5e;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-brand">
      <div class="login-brand-icon">
        <i class="fa-solid fa-motorcycle"></i>
      </div>
      <h1>MS MOTO ZONE</h1>
      <p>স্টোর ও ইনভেন্টরি ম্যানেজমেন্ট পোর্টাল</p>
    </div>

    <div class="login-card">
      <h2 style="font-size:1.3rem;margin-bottom:6px;">ম্যানেজার লগইন</h2>
      <p style="font-size:0.88rem;color:var(--sub);margin-bottom:24px;">আপনার ক্রেডেনশিয়ালস দিয়ে পোর্টালে প্রবেশ করুন</p>

      <div class="error-msg" id="errorMsg">
        <i class="fa-solid fa-triangle-exclamation"></i> <span>ইমেইল বা পাসওয়ার্ড সঠিক নয়</span>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label>ইমেইল অ্যাড্রেস</label>
          <input type="email" id="emailInput" class="form-input" required placeholder="manager@motozone.com">
        </div>
        <div class="form-group">
          <label>পাসওয়ার্ড</label>
          <input type="password" id="passInput" class="form-input" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-login" id="btnLoginSubmit">
          লগইন করুন <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div style="text-align:center;margin-top:16px;">
        <p style="font-size:0.8rem;color:var(--sub);">MS Moto Zone — Spare Parts Manager v2.0</p>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAwNoEgIknQTX6EQ4WYN66ls5YGp7Ii0yg",
      authDomain: "moto-zone-stock.firebaseapp.com",
      projectId: "moto-zone-stock",
      storageBucket: "moto-zone-stock.firebasestorage.app",
      messagingSenderId: "843038006376",
      appId: "1:843038006376:web:fdcc2d6e6d42d572872fdd"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const savedTheme = localStorage.getItem('MOTO_THEME') || 'light';
    document.documentElement.className = savedTheme;

    const btnSubmit = document.getElementById('btnLoginSubmit');

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const pass  = document.getElementById('passInput').value;
      const errorMsg = document.getElementById('errorMsg');
      
      try {
        errorMsg.style.display = 'none';
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> প্রসেস হচ্ছে...';
        
        try {
          await auth.signInWithEmailAndPassword(email, pass);
        } catch (signInErr) {
          if (signInErr.code === 'auth/user-not-found' || signInErr.code === 'auth/invalid-credential') {
            // Auto register manager account on first login!
            await auth.createUserWithEmailAndPassword(email, pass);
          } else {
            throw signInErr;
          }
        }

        window.location.href = 'index.html';
      } catch (err) {
        console.error('Login Error:', err);
        let msg = 'ইমেইল বা পাসওয়ার্ড সঠিক নয়';
        if (err.code === 'auth/weak-password') msg = 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে';
        if (err.code === 'auth/invalid-email') msg = 'সঠিক ইমেইল ঠিকানা দিন';
        errorMsg.querySelector('span').textContent = msg;
        errorMsg.style.display = 'block';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = 'লগইন করুন <i class="fa-solid fa-arrow-right"></i>';
      }
    });
  </script>
</body>
</html>
